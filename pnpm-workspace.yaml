packages:
  - 'apps/desktop'
  - 'apps/web'
  - 'packages/*'
  - 'services/api'
  - 'services/engine'
  - 'tools/*'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true

engineStrict: true
pmOnFail: download

overrides:
  '@fastify/ajv-compiler>fast-uri': 3.1.5
  find-my-way: 9.7.0
  js-yaml: 5.2.2
  nanoid: 3.3.18
  react-router: 8.3.0
