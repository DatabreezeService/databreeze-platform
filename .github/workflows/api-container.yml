name: api-container

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/api-container.yml'
      - '.node-version'
      - 'infrastructure/containers/api/**'
      - 'infrastructure/containers/worker/**'
      - 'package.json'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - 'packages/telemetry/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'services/api/**'
      - 'tsconfig.base.json'
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/api-container.yml'
      - '.node-version'
      - 'infrastructure/containers/api/**'
      - 'infrastructure/containers/worker/**'
      - 'package.json'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - 'packages/telemetry/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'services/api/**'
      - 'tsconfig.base.json'

permissions:
  contents: read

jobs:
  build:
    name: Build API container (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: databreeze-api:${{ github.sha }}
      DATABASE_URL: postgresql://databreeze:databreeze-ci@127.0.0.1:5432/databreeze
      CONTAINER_DATABASE_URL: postgresql://databreeze:databreeze-ci@127.0.0.1:5432/databreeze
      DATABREEZE_CSRF_ALLOWED_ORIGINS: https://app.databreeze.example
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: databreeze
          POSTGRES_PASSWORD: databreeze-ci
          POSTGRES_USER: databreeze
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U databreeze -d databreeze" --health-interval 2s
          --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Install API migration dependencies
        run: pnpm install --frozen-lockfile --filter @databreeze/api...
      - name: Migrate disposable smoke database
        run: pnpm --filter @databreeze/api exec prisma migrate deploy --config prisma.config.ts
      - name: Build API container from repository root
        run: |
          docker build --file infrastructure/containers/api/Dockerfile --tag "$IMAGE" .
      - name: Inspect runtime container contract
        shell: bash
        run: |
          set -euo pipefail
          inspection="$(docker image inspect "$IMAGE" --format '{{json .Config.User}} {{json .Config.Entrypoint}} {{json .Config.Healthcheck}}')"
          printf '%s\n' "$inspection"
          grep -F '10001:10001' <<<"$inspection"
          grep -F '/nodejs/bin/node' <<<"$inspection"
          grep -F 'dist/main.js' <<<"$inspection"
          grep -F '/health/ready' <<<"$inspection"
      - name: Run bounded production fail-closed smoke
        shell: bash
        run: |
          set +e
          output="$(timeout --foreground 30s docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --env NODE_ENV=production "$IMAGE" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -eq 0 ]]; then
            echo 'Production API unexpectedly started without DATABASE_URL.' >&2
            exit 1
          fi
          if [[ "$status" -eq 124 ]]; then
            echo 'Production API did not fail closed within the smoke timeout.' >&2
            exit 1
          fi
          grep -F 'PRODUCTION_DATABASE_URL_INVALID' <<<"$output"
      - name: Run positive read-only readiness and SIGTERM smoke
        shell: bash
        run: |
          set -euo pipefail
          container_name="databreeze-api-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          service_account_key="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"

          docker run --detach --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --name "$container_name" \
            --network host \
            --env NODE_ENV=production \
            --env PORT=3100 \
            --env DATABASE_URL="$CONTAINER_DATABASE_URL" \
            --env DATABREEZE_RUNTIME_PROFILE=pilot \
            --env DATABREEZE_PILOT_HTTPS_ORIGIN=https://pilot.databreeze.example \
            --env DATABREEZE_REDIS_URL=redis://127.0.0.1:6379 \
            --env DATABREEZE_LOCAL_EMAIL_PROVIDER=mailpit \
            --env DATABREEZE_IAM_SMTP_HOST=127.0.0.1 \
            --env DATABREEZE_IAM_SMTP_PORT=1025 \
            --env DATABREEZE_IAM_EMAIL_FROM_ADDRESS=verify@databreeze.example \
            --env DATABREEZE_IAM_EMAIL_VERIFICATION_DIGEST_KEY="$service_account_key" \
            --env DATABREEZE_IAM_EMAIL_VERIFICATION_ENVELOPE_KEY="$service_account_key" \
            --env DATABREEZE_IAM_INVITATION_DIGEST_KEY="$service_account_key" \
            --env DATABREEZE_IAM_REGISTRATION_ADMISSION_KEY="$service_account_key" \
            --env DATABREEZE_IAM_RECOVERY_DIGEST_KEY="$service_account_key" \
            --env DATABREEZE_SERVICE_ACCOUNT_SECRET_ENVELOPE_KEY="$service_account_key" \
            --health-interval 1s \
            --health-timeout 3s \
            --health-start-period 1s \
            --health-retries 10 \
            "$IMAGE" >/dev/null

          healthy=false
          for _ in {1..60}; do
            state="$(docker inspect --format '{{.State.Status}}' "$container_name")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [[ "$health" == 'healthy' ]]; then
              healthy=true
              break
            fi
            if [[ "$state" == 'exited' || "$health" == 'unhealthy' ]]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          if [[ "$healthy" != 'true' ]]; then
            docker logs "$container_name"
            echo 'Production API did not become healthy.' >&2
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3100/health/ready >/dev/null
          started_at="$(date +%s)"
          docker stop --time 30 "$container_name" >/dev/null
          elapsed="$(( $(date +%s) - started_at ))"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container_name")"
          if [[ "$exit_code" -ne 0 || "$elapsed" -gt 30 ]]; then
            docker logs "$container_name"
            echo "Production API shutdown failed: exit=$exit_code elapsed=${elapsed}s" >&2
            exit 1
          fi
