name: ${COMPOSE_PROJECT_NAME:-databreeze-local}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17.5-alpine}
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-databreeze}
      POSTGRES_USER: ${POSTGRES_USER:-databreeze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-databreeze-local-change-me}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    networks: [local]
    logging: *default-logging
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7.4.5-alpine}
    init: true
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    networks: [local]
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z}
    init: true
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-databreeze}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-databreeze-local-change-me}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    networks: [local]
    logging: *default-logging
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    init: true
    depends_on:
      minio:
        condition: service_healthy
    networks: [local]
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-databreeze}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-databreeze-local-change-me}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-databreeze-artifacts}
      MINIO_BUCKET_RESULTS: ${MINIO_BUCKET_RESULTS:-databreeze-results}
    entrypoint: ['/bin/sh', '/bootstrap-buckets.sh']
    volumes:
      - ./minio/bootstrap-buckets.sh:/bootstrap-buckets.sh:ro
    restart: 'no'

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21.8}
    init: true
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    networks: [local]
    logging: *default-logging
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:8025/api/v1/info]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  otel-collector:
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.128.0}
    init: true
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133'
    networks: [local]
    logging: *default-logging
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    # The collector image is intentionally distroless and has no shell or
    # wget. `validate` is its built-in executable health probe; the
    # otel-collector-health companion below verifies the live HTTP endpoint.
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol-contrib/config.yaml]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  otel-collector-health:
    image: ${HEALTHCHECK_IMAGE:-curlimages/curl:8.14.1}
    init: true
    depends_on:
      otel-collector:
        condition: service_started
    networks: [local]
    logging: *default-logging
    command: ['sh', '-c', "trap 'exit 0' TERM INT; while :; do sleep 3600; done"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://otel-collector:13133/]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api-migrate:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/containers/api/Dockerfile
      target: migration
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-databreeze}:${POSTGRES_PASSWORD:-databreeze-local-change-me}@postgres:5432/${POSTGRES_DB:-databreeze}?schema=public
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
    networks: [local]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'

  api:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/containers/api/Dockerfile
      target: runtime
    init: true
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-databreeze}:${POSTGRES_PASSWORD:-databreeze-local-change-me}@postgres:5432/${POSTGRES_DB:-databreeze}?schema=public
      DATABREEZE_RUNTIME_PROFILE: local
      DATABREEZE_LOCAL_HTTPS_ORIGIN: https://localhost:${WEB_HTTPS_PORT:-8443}
      DATABREEZE_REDIS_URL: redis://redis:6379
      DATABREEZE_LOCAL_EMAIL_PROVIDER: ${DATABREEZE_LOCAL_EMAIL_PROVIDER:-mailpit}
      DATABREEZE_IAM_SMTP_HOST: ${DATABREEZE_IAM_SMTP_HOST:-mailpit}
      DATABREEZE_IAM_SMTP_PORT: ${DATABREEZE_IAM_SMTP_PORT:-1025}
      DATABREEZE_IAM_SMTP_USERNAME: ${DATABREEZE_IAM_SMTP_USERNAME:-}
      DATABREEZE_IAM_SMTP_APP_PASSWORD: ${DATABREEZE_IAM_SMTP_APP_PASSWORD:-}
      DATABREEZE_IAM_EMAIL_FROM_ADDRESS: ${DATABREEZE_IAM_EMAIL_FROM_ADDRESS:-verify@databreeze.local}
      DATABREEZE_IAM_EMAIL_VERIFICATION_DIGEST_KEY: ${DATABREEZE_IAM_EMAIL_VERIFICATION_DIGEST_KEY:-ERERERERERERERERERERERERERERERERERERERERERE}
      DATABREEZE_IAM_EMAIL_VERIFICATION_ENVELOPE_KEY: ${DATABREEZE_IAM_EMAIL_VERIFICATION_ENVELOPE_KEY:-EhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhI}
      DATABREEZE_IAM_REGISTRATION_ADMISSION_KEY: ${DATABREEZE_IAM_REGISTRATION_ADMISSION_KEY:-ExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExM}
      DATABREEZE_SERVICE_ACCOUNT_SECRET_ENVELOPE_KEY: ${DATABREEZE_SERVICE_ACCOUNT_SECRET_ENVELOPE_KEY:-FBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQ}
      DATABREEZE_LOCAL_MINIO_ENDPOINT: http://minio:9000
      DATABREEZE_LOCAL_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-databreeze}
      DATABREEZE_LOCAL_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-databreeze-local-change-me}
      DATABREEZE_LOCAL_MINIO_BUCKET: ${MINIO_BUCKET_ARTIFACTS:-databreeze-artifacts}
      # Local uses the deterministic adapter unless PAYOS_PROVIDER=payos is explicitly selected.
      PAYOS_PROVIDER: ${PAYOS_PROVIDER:-mock}
      PAYOS_LOCAL_TEST_MODE: ${PAYOS_LOCAL_TEST_MODE:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      DATABREEZE_WEB_PUBLIC_URL: ${DATABREEZE_WEB_PUBLIC_URL:-https://localhost:8443}
      DATABREEZE_PAYOS_SUCCESS_URL: ${DATABREEZE_PAYOS_SUCCESS_URL:-https://localhost:8443/vi-VN/billing/success}
      DATABREEZE_PAYOS_FAILED_URL: ${DATABREEZE_PAYOS_FAILED_URL:-https://localhost:8443/vi-VN/billing/failed}
    expose:
      - '3000'
    networks: [local]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/containers/web/Dockerfile
      target: runtime
      args:
        VITE_DATABREEZE_DEMO_MODE: ${VITE_DATABREEZE_DEMO_MODE:-true}
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_HTTPS_PORT:-8443}:8443'
    networks: [local]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    volumes:
      - web-caddy-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-postgres-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-redis-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-minio-data
  mailpit-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-mailpit-data
  web-caddy-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-web-caddy-data

networks:
  local:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-network
