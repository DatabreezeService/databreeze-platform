name: ${COMPOSE_PROJECT_NAME:-databreeze-local}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17.5-alpine}
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-databreeze}
      POSTGRES_USER: ${POSTGRES_USER:-databreeze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-databreeze-local-change-me}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    networks: [local]
    logging: *default-logging
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7.4.5-alpine}
    init: true
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    networks: [local]
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z}
    init: true
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-databreeze}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-databreeze-local-change-me}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    networks: [local]
    logging: *default-logging
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    init: true
    depends_on:
      minio:
        condition: service_healthy
    networks: [local]
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-databreeze}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-databreeze-local-change-me}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-databreeze-artifacts}
      MINIO_BUCKET_RESULTS: ${MINIO_BUCKET_RESULTS:-databreeze-results}
    entrypoint: ['/bin/sh', '/bootstrap-buckets.sh']
    volumes:
      - ./minio/bootstrap-buckets.sh:/bootstrap-buckets.sh:ro
    restart: 'no'

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21.8}
    init: true
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    networks: [local]
    logging: *default-logging
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:8025/api/v1/info]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  otel-collector:
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.128.0}
    init: true
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133'
    networks: [local]
    logging: *default-logging
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    # The collector image is intentionally distroless and has no shell or
    # wget. `validate` is its built-in executable health probe; the
    # otel-collector-health companion below verifies the live HTTP endpoint.
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol-contrib/config.yaml]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  otel-collector-health:
    image: ${HEALTHCHECK_IMAGE:-curlimages/curl:8.14.1}
    init: true
    depends_on:
      otel-collector:
        condition: service_started
    networks: [local]
    logging: *default-logging
    command: ['sh', '-c', "trap 'exit 0' TERM INT; while :; do sleep 3600; done"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://otel-collector:13133/]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api-migrate:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/containers/api/Dockerfile
      target: migration
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-databreeze}:${POSTGRES_PASSWORD:-databreeze-local-change-me}@postgres:5432/${POSTGRES_DB:-databreeze}?schema=public
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
    networks: [local]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'

  api:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/containers/api/Dockerfile
      target: runtime
    init: true
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-databreeze}:${POSTGRES_PASSWORD:-databreeze-local-change-me}@postgres:5432/${POSTGRES_DB:-databreeze}?schema=public
      DATABREEZE_RUNTIME_PROFILE: local
      # Keep the checked-in seed discoverable even when an older ignored
      # infrastructure/local/.env predates DATABREEZE_LOCAL_PROJECT_ID.
      # An explicit empty value still opts into the intentional empty-workspace
      # test because Compose preserves a supplied empty environment variable.
      DATABREEZE_LOCAL_PROJECT_ID: ${DATABREEZE_LOCAL_PROJECT_ID-00000000-0000-4000-8000-000000000003}
      DATABREEZE_LOCAL_HTTPS_ORIGIN: https://localhost:${WEB_HTTPS_PORT:-8443}
      DATABREEZE_REDIS_URL: redis://redis:6379
      DATABREEZE_LOCAL_EMAIL_PROVIDER: ${DATABREEZE_LOCAL_EMAIL_PROVIDER:-mailpit}
      DATABREEZE_IAM_SMTP_HOST: ${DATABREEZE_IAM_SMTP_HOST:-mailpit}
      DATABREEZE_IAM_SMTP_PORT: ${DATABREEZE_IAM_SMTP_PORT:-1025}
      DATABREEZE_IAM_SMTP_USERNAME: ${DATABREEZE_IAM_SMTP_USERNAME:-}
      DATABREEZE_IAM_SMTP_APP_PASSWORD: ${DATABREEZE_IAM_SMTP_APP_PASSWORD:-}
      DATABREEZE_IAM_EMAIL_FROM_ADDRESS: ${DATABREEZE_IAM_EMAIL_FROM_ADDRESS:-verify@databreeze.local}
      DATABREEZE_IAM_EMAIL_VERIFICATION_DIGEST_KEY: ${DATABREEZE_IAM_EMAIL_VERIFICATION_DIGEST_KEY:-ERERERERERERERERERERERERERERERERERERERERERE}
      DATABREEZE_IAM_EMAIL_VERIFICATION_ENVELOPE_KEY: ${DATABREEZE_IAM_EMAIL_VERIFICATION_ENVELOPE_KEY:-EhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhI}
      DATABREEZE_IAM_INVITATION_DIGEST_KEY: ${DATABREEZE_IAM_INVITATION_DIGEST_KEY:-GRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRk}
      DATABREEZE_IAM_REGISTRATION_ADMISSION_KEY: ${DATABREEZE_IAM_REGISTRATION_ADMISSION_KEY:-ExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExM}
      DATABREEZE_IAM_RECOVERY_DIGEST_KEY: ${DATABREEZE_IAM_RECOVERY_DIGEST_KEY:-FBUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRU}
      DATABREEZE_SERVICE_ACCOUNT_SECRET_ENVELOPE_KEY: ${DATABREEZE_SERVICE_ACCOUNT_SECRET_ENVELOPE_KEY:-FBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQ}
      DATABREEZE_LOCAL_MINIO_ENDPOINT: http://minio:9000
      DATABREEZE_LOCAL_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-databreeze}
      DATABREEZE_LOCAL_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-databreeze-local-change-me}
      DATABREEZE_LOCAL_MINIO_BUCKET: ${MINIO_BUCKET_ARTIFACTS:-databreeze-artifacts}
      DATABREEZE_LOCAL_MINIO_RESULTS_BUCKET: ${MINIO_BUCKET_RESULTS:-databreeze-results}
      DATABREEZE_IAE_WORKER_CAPABILITY_SIGNING_KEY: ${DATABREEZE_IAE_WORKER_CAPABILITY_SIGNING_KEY:-BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc}
      # Local uses the deterministic adapter unless PAYOS_PROVIDER=payos is explicitly selected.
      PAYOS_PROVIDER: ${PAYOS_PROVIDER:-mock}
      PAYOS_LOCAL_TEST_MODE: ${PAYOS_LOCAL_TEST_MODE:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      DATABREEZE_WEB_PUBLIC_URL: ${DATABREEZE_WEB_PUBLIC_URL:-https://localhost:8443}
      DATABREEZE_PAYOS_SUCCESS_URL: ${DATABREEZE_PAYOS_SUCCESS_URL:-https://localhost:8443/vi-VN/billing/success}
      DATABREEZE_PAYOS_FAILED_URL: ${DATABREEZE_PAYOS_FAILED_URL:-https://localhost:8443/vi-VN/billing/failed}
      # Optional local-only provider gates. Values come from the ignored
      # infrastructure/local/.env and are never baked into the image.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABREEZE_OPENAI_AGENT_ENABLED: ${DATABREEZE_OPENAI_AGENT_ENABLED:-false}
      DATABREEZE_OPENAI_AGENT_MODEL: ${DATABREEZE_OPENAI_AGENT_MODEL:-gpt-4o-mini-2024-07-18}
      DATABREEZE_OPENAI_AGENT_TIMEOUT_MS: ${DATABREEZE_OPENAI_AGENT_TIMEOUT_MS:-30000}
      DATABREEZE_OPENAI_AGENT_MAX_OUTPUT_TOKENS: ${DATABREEZE_OPENAI_AGENT_MAX_OUTPUT_TOKENS:-1200}
      DATABREEZE_OPENAI_RECEIPT_ENABLED: ${DATABREEZE_OPENAI_RECEIPT_ENABLED:-false}
      DATABREEZE_OPENAI_RECEIPT_MODEL: ${DATABREEZE_OPENAI_RECEIPT_MODEL:-gpt-4o-mini-2024-07-18}
      DATABREEZE_OPENAI_DASHBOARD_ENABLED: ${DATABREEZE_OPENAI_DASHBOARD_ENABLED:-false}
      DATABREEZE_OPENAI_DASHBOARD_MODEL: ${DATABREEZE_OPENAI_DASHBOARD_MODEL:-gpt-4o-mini-2024-07-18}
      DATABREEZE_OPENAI_ANALYSIS_ENABLED: ${DATABREEZE_OPENAI_ANALYSIS_ENABLED:-false}
      DATABREEZE_OPENAI_ANALYSIS_MODEL: ${DATABREEZE_OPENAI_ANALYSIS_MODEL:-gpt-4o-mini-2024-07-18}
      DATABREEZE_OPENAI_NARRATIVE_ENABLED: ${DATABREEZE_OPENAI_NARRATIVE_ENABLED:-false}
      DATABREEZE_OPENAI_NARRATIVE_MODEL: ${DATABREEZE_OPENAI_NARRATIVE_MODEL:-gpt-4o-mini-2024-07-18}
      DATABREEZE_OPENAI_MAPPING_ENABLED: ${DATABREEZE_OPENAI_MAPPING_ENABLED:-false}
      DATABREEZE_OPENAI_MAPPING_MODEL: ${DATABREEZE_OPENAI_MAPPING_MODEL:-gpt-4o-mini-2024-07-18}
      DATABREEZE_OPENAI_MAPPING_ALLOW_SAMPLES: ${DATABREEZE_OPENAI_MAPPING_ALLOW_SAMPLES:-false}
      DATABREEZE_OPENAI_IMAGE_DETAIL: ${DATABREEZE_OPENAI_IMAGE_DETAIL:-high}
      DATABREEZE_OPENAI_TIMEOUT_MS: ${DATABREEZE_OPENAI_TIMEOUT_MS:-30000}
      DATABREEZE_OPENAI_MAX_OUTPUT_TOKENS: ${DATABREEZE_OPENAI_MAX_OUTPUT_TOKENS:-1200}
    expose:
      - '3000'
    networks: [local]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/containers/worker/Dockerfile
      target: runtime
    init: true
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABREEZE_WORKER_API_ENDPOINT: https://web:8443
      DATABREEZE_WORKER_BEARER_TOKEN: ${DATABREEZE_LOCAL_WORKER_BEARER:-databreeze-local-worker-bearer-change-me}
      # Caddy's local CA is shared read-only; the worker still performs normal
      # certificate verification instead of disabling TLS for the gateway.
      SSL_CERT_FILE: /caddy-data/caddy/pki/authorities/local/root.crt
    networks: [local]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/databreeze:rw,noexec,nosuid,size=16m
    volumes:
      - web-caddy-data:/caddy-data:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/containers/web/Dockerfile
      target: runtime
      args:
        VITE_DATABREEZE_DEMO_MODE: ${VITE_DATABREEZE_DEMO_MODE:-false}
        VITE_DATABREEZE_LOCAL_NAVIGATION_HINTS: ${VITE_DATABREEZE_LOCAL_NAVIGATION_HINTS:-true}
        VITE_DATABREEZE_LOCAL_PAYMENT_MODE: ${VITE_DATABREEZE_LOCAL_PAYMENT_MODE:-mock}
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_HTTPS_PORT:-8443}:8443'
    networks: [local]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    volumes:
      - web-caddy-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-postgres-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-redis-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-minio-data
  mailpit-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-mailpit-data
  web-caddy-data:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-web-caddy-data

networks:
  local:
    name: ${COMPOSE_PROJECT_NAME:-databreeze-local}-network
